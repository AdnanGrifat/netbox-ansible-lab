---
- name: Install Grafana
  hosts: monitoring
  become: true

  tasks:
    - name: Add Grafana repo
      copy:
        dest: /etc/yum.repos.d/grafana.repo
        content: |
          [grafana]
          name=Grafana
          baseurl=https://packages.grafana.com/oss/rpm
          repo_gpgcheck=1
          enabled=1
          gpgcheck=1
          gpgkey=https://packages.grafana.com/gpg.key
          sslverify=1
        mode: '0644'

    - name: Install Grafana
      yum:
        name: grafana
        state: present

    - name: Start and enable Grafana
      service:
        name: grafana-server
        state: started
        enabled: true
