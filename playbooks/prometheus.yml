---
- name: Install Prometheus
  hosts: monitoring
  become: true

  vars:
    prometheus_version: "2.51.2"

  tasks:
    - name: Create prometheus user
      user:
        name: prometheus
        shell: /sbin/nologin
        system: true
        create_home: false

    - name: Create Prometheus directories
      file:
        path: "{{ item }}"
        state: directory
        owner: prometheus
        group: prometheus
        mode: '0755'
      loop:
        - /etc/prometheus
        - /var/lib/prometheus

    - name: Download Prometheus
      get_url:
        url: "https://github.com/prometheus/prometheus/releases/download/v{{ prometheus_version }}/prometheus-{{ prometheus_version }}.linux-amd64.tar.gz"
        dest: "/tmp/prometheus-{{ prometheus_version }}.linux-amd64.tar.gz"
        mode: '0644'

    - name: Extract Prometheus
      unarchive:
        src: "/tmp/prometheus-{{ prometheus_version }}.linux-amd64.tar.gz"
        dest: /tmp
        remote_src: true

    - name: Install Prometheus binary
      copy:
        src: "/tmp/prometheus-{{ prometheus_version }}.linux-amd64/prometheus"
        dest: /usr/local/bin/prometheus
        owner: root
        group: root
        mode: '0755'
        remote_src: true

    - name: Install promtool binary
      copy:
        src: "/tmp/prometheus-{{ prometheus_version }}.linux-amd64/promtool"
        dest: /usr/local/bin/promtool
        owner: root
        group: root
        mode: '0755'
        remote_src: true

    - name: Copy consoles directory
      copy:
        src: "/tmp/prometheus-{{ prometheus_version }}.linux-amd64/consoles/"
        dest: /etc/prometheus/consoles/
        owner: prometheus
        group: prometheus
        mode: '0755'
        remote_src: true

    - name: Copy console_libraries directory
      copy:
        src: "/tmp/prometheus-{{ prometheus_version }}.linux-amd64/console_libraries/"
        dest: /etc/prometheus/console_libraries/
        owner: prometheus
        group: prometheus
        mode: '0755'
        remote_src: true

    - name: Deploy Prometheus config
      copy:
        dest: /etc/prometheus/prometheus.yml
        owner: prometheus
        group: prometheus
        mode: '0644'
        content: |
          global:
            scrape_interval: 15s

          scrape_configs:
            - job_name: 'node_exporters'
              static_configs:
                - targets:
                  - '198.211.96.26:9100'
                  - '159.203.82.155:9100'
                  - '159.203.142.198:9100'

    - name: Create Prometheus systemd service
      copy:
        dest: /etc/systemd/system/prometheus.service
        owner: root
        group: root
        mode: '0644'
        content: |
          [Unit]
          Description=Prometheus
          Wants=network-online.target
          After=network-online.target

          [Service]
          User=prometheus
          Group=prometheus
          Type=simple
          ExecStart=/usr/local/bin/prometheus \
            --config.file=/etc/prometheus/prometheus.yml \
            --storage.tsdb.path=/var/lib/prometheus \
            --web.console.templates=/etc/prometheus/consoles \
            --web.console.libraries=/etc/prometheus/console_libraries

          [Install]
          WantedBy=multi-user.target

    - name: Reload systemd
      systemd:
        daemon_reload: true

    - name: Enable and start Prometheus
      service:
        name: prometheus
        state: started
        enabled: true


