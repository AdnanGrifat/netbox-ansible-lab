- name: Install and start nginx on managed hosts
  hosts: all
  become: true

  tasks:
    - name: Install nginx
      package:
        name: nginx
        state: present

    - name: Enable and start nginx
      service:
        name: nginx
        state: started
        enabled: true

    - name: Deploy custom index page
      template:
        src: ../templates/index.html.j2
        dest: /var/www/html/index.html

